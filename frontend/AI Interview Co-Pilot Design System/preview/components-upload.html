<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Upload Zone</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0" />
<style>
  html,body{margin:0;background:var(--surface);font-family:var(--font-sans);color:var(--on-surface);}
  .wrap{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .zone{border-radius:var(--r-card);padding:18px 12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;}
  .zone .ms{font-family:'Material Symbols Outlined';font-size:36px;}
  .ttl{font:600 14px var(--font-sans);color:var(--on-surface);}
  .sub{font:var(--t-caption);color:var(--on-surface-variant);}
  .meta{font:var(--t-micro);color:var(--on-surface-subtle);text-align:center;letter-spacing:.04em;}
  .idle{background:var(--surface-variant);border:2px dashed var(--outline);}
  .idle .ms{color:var(--on-surface-subtle);}
  .hover{background:var(--primary-light);border:2px dashed var(--primary);}
  .hover .ms{color:var(--primary);}
  .hover .ttl{color:var(--primary-dark);}
  .progress{height:3px;background:var(--outline-variant);border-radius:2px;overflow:hidden;margin-top:8px;width:80%;}
  .progress .bar{height:100%;width:48%;background:var(--primary);}
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="zone idle">
        <span class="ms">cloud_upload</span>
        <div class="ttl">Upload Resume to Begin</div>
        <div class="sub">Drag & drop PDF or DOCX</div>
      </div>
      <div class="meta" style="margin-top:6px;">SUPPORTED · PDF, DOCX</div>
    </div>
    <div>
      <div class="zone hover">
        <span class="ms">cloud_upload</span>
        <div class="ttl">Drop to upload</div>
        <div class="sub">Uploading resume…</div>
        <div class="progress"><div class="bar"></div></div>
      </div>
      <div class="meta" style="margin-top:6px;">DRAG-HOVER + UPLOADING</div>
    </div>
  </div>
</body>
</html>
