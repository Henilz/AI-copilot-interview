<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
<style>
  html,body{margin:0;background:var(--surface);font-family:var(--font-sans);color:var(--on-surface);}
  .wrap{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;align-items:start;}
  .row{display:flex;flex-direction:column;gap:8px;}
  .lbl{font:var(--t-micro);color:var(--on-surface-subtle);letter-spacing:.06em;}
  .btn-primary{height:40px;border-radius:var(--r-pill);background:var(--primary);color:#fff;border:none;font:500 14px var(--font-sans);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;cursor:pointer;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{background:var(--surface-container);color:var(--on-surface-subtle);cursor:not-allowed;}
  .btn-secondary{height:40px;border-radius:var(--r-pill);background:transparent;color:var(--primary);border:1.5px solid var(--primary);font:500 14px var(--font-sans);padding:0 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .link-destruct{background:transparent;border:none;color:var(--error);font:500 13px var(--font-sans);cursor:pointer;padding:6px 0;}
  .link-destruct:hover{text-decoration:underline;}
  .icon-btn{width:32px;height:32px;border-radius:50%;background:transparent;border:none;display:grid;place-items:center;cursor:pointer;}
  .icon-btn:hover{background:var(--surface-container);}
  .icon-btn .ms{font-family:'Material Symbols Outlined';font-size:20px;color:var(--on-surface-variant);}
  .icon-row{display:flex;gap:8px;}
  .ms-inline{font-family:'Material Symbols Outlined';font-size:18px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="lbl">PRIMARY · pill · 40h</div>
      <button class="btn-primary">Next Question <span class="ms-inline">arrow_forward</span></button>
    </div>
    <div class="row">
      <div class="lbl">PRIMARY · disabled</div>
      <button class="btn-primary" disabled>Start Interview</button>
    </div>
    <div class="row">
      <div class="lbl">SECONDARY · outlined</div>
      <button class="btn-secondary"><span class="ms-inline">refresh</span>Start New Interview</button>
    </div>
    <div class="row">
      <div class="lbl">DESTRUCTIVE · text link</div>
      <button class="link-destruct">End Interview</button>
    </div>
    <div class="row">
      <div class="lbl">ICON · 32px</div>
      <div class="icon-row">
        <button class="icon-btn"><span class="ms">refresh</span></button>
        <button class="icon-btn"><span class="ms">content_copy</span></button>
        <button class="icon-btn"><span class="ms">close</span></button>
      </div>
    </div>
    <div class="row">
      <div class="lbl">PRIMARY · with leading icon</div>
      <button class="btn-primary"><span class="ms-inline">download</span>Download PDF Report</button>
    </div>
  </div>
</body>
</html>
