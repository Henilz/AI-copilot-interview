<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Live Transcript</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
<style>
  html,body{margin:0;background:var(--surface);font-family:var(--font-sans);color:var(--on-surface);}
  .wrap{padding:18px 22px;display:flex;flex-direction:column;gap:10px;}
  .head{display:flex;align-items:center;gap:6px;}
  .ttl{font:var(--t-caption);color:var(--on-surface-variant);}
  .ms{font-family:'Material Symbols Outlined';font-size:16px;color:var(--success);}
  .area{background:var(--surface-variant);border:1px solid var(--outline-variant);border-radius:var(--r-input);padding:12px;font:13px/20px var(--font-sans);color:var(--on-surface);max-height:120px;overflow:auto;}
  .cursor{display:inline-block;width:2px;height:14px;background:var(--primary);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(2,end) infinite;}
  @keyframes blink{50%{opacity:0}}
  .placeholder{color:var(--on-surface-subtle);font-style:italic;}
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="head"><span class="ms">graphic_eq</span><span class="ttl">Live Transcript</span></div>
      <div class="area">I think the most challenging conflict I navigated was when two senior engineers on my team disagreed about the migration path for our payments service<span class="cursor"></span></div>
    </div>
    <div>
      <div class="head"><span class="ms" style="color:var(--on-surface-subtle)">mic_off</span><span class="ttl">Live Transcript</span></div>
      <div class="area"><span class="placeholder">Transcript will appear here when listening…</span></div>
    </div>
  </div>
</body>
</html>
