<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Logo & Mark</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;background:var(--surface);font-family:var(--font-sans);color:var(--on-surface);}
  .wrap{padding:24px;display:grid;grid-template-columns:140px 1fr;gap:24px;align-items:center;}
  .mark{width:88px;height:88px;border-radius:20px;background:var(--primary);display:grid;place-items:center;color:#fff;}
  .mark .ms{font-family:'Material Symbols Outlined';font-size:48px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 48;}
  .word{font:600 24px/1 var(--font-sans);letter-spacing:-.01em;color:var(--on-surface);}
  .tag{font:var(--t-caption);color:var(--on-surface-variant);margin-top:6px;}
  .row{display:flex;gap:14px;align-items:center;margin-top:18px;}
  .small{width:32px;height:32px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#fff;}
  .small .ms{font-family:'Material Symbols Outlined';font-size:20px;}
  .lockup{display:flex;gap:10px;align-items:center;font:600 16px/1 var(--font-sans);color:var(--on-surface);}
  .meta{font:var(--t-micro);color:var(--on-surface-subtle);letter-spacing:.06em;}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" />
</head>
<body>
  <div class="wrap">
    <div class="mark"><span class="ms">smart_toy</span></div>
    <div>
      <div class="word">AI Interview Co-Pilot</div>
      <div class="tag">Interview smarter, hire better.</div>
      <div class="row">
        <div class="lockup"><div class="small"><span class="ms">smart_toy</span></div>AI Interview Co-Pilot</div>
      </div>
      <div class="meta" style="margin-top:14px;">MARK · smart_toy · primary #1A73E8</div>
    </div>
  </div>
</body>
</html>
