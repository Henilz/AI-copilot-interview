<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;background:var(--surface);font-family:var(--font-sans);color:var(--on-surface);}
  .wrap{padding:20px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .sw{border:1px solid var(--outline-variant);border-radius:var(--r-card);overflow:hidden;}
  .chip{height:72px;}
  .meta{padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .name{font:var(--t-section-head);color:var(--on-surface);}
  .hex{font:var(--t-caption);color:var(--on-surface-variant);font-variant-numeric:tabular-nums;}
  .use{padding:0 12px 10px;font:var(--t-micro);color:var(--on-surface-subtle);text-transform:none;letter-spacing:0;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw">
      <div class="chip" style="background:var(--primary)"></div>
      <div class="meta"><span class="name">primary</span><span class="hex">#1A73E8</span></div>
      <div class="use">Buttons · links · active states</div>
    </div>
    <div class="sw">
      <div class="chip" style="background:var(--primary-light)"></div>
      <div class="meta"><span class="name">primary-light</span><span class="hex">#E8F0FE</span></div>
      <div class="use">Chip bg · subtle accents</div>
    </div>
    <div class="sw">
      <div class="chip" style="background:var(--primary-dark)"></div>
      <div class="meta"><span class="name">primary-dark</span><span class="hex">#1557B0</span></div>
      <div class="use">Hover on primary</div>
    </div>
  </div>
</body>
</html>
