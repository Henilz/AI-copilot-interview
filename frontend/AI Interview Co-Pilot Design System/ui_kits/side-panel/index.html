<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Interview Co-Pilot — Side Panel UI Kit</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..40,400,0..1,0" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div class="stage">
    <div class="frame-rail" id="rail"></div>
  </div>

  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="UploadZone.jsx"></script>
  <script type="text/babel" src="QuestionCard.jsx"></script>
  <script type="text/babel" src="ScoreMeter.jsx"></script>
  <script type="text/babel" src="SummaryView.jsx"></script>
  <script type="text/babel" src="Panel.jsx"></script>

  <script type="text/babel">
    const { useState } = React;
    const SCENARIOS = [
      { id: 'idle',         label: '1 · Idle / Upload' },
      { id: 'interviewing', label: '2 · Live Interview' },
      { id: 'loading',      label: '3 · Between Questions' },
      { id: 'complete',     label: '4 · Complete' },
    ];

    function App() {
      const [active, setActive] = useState('all');
      const visible = active === 'all' ? SCENARIOS : SCENARIOS.filter(s => s.id === active);
      return (
        <>
          <div className="tabs">
            <button className={`tab ${active==='all'?'active':''}`} onClick={() => setActive('all')}>All Screens</button>
            {SCENARIOS.map(s => (
              <button key={s.id} className={`tab ${active===s.id?'active':''}`} onClick={() => setActive(s.id)}>{s.label}</button>
            ))}
          </div>
          <div className="stage">
            <div className="frame-rail">
              {visible.map(s => (
                <div key={s.id} className="frame">
                  <Panel scenario={s.id} />
                  <div className="frame-label">{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        </>
      );
    }

    // Replace the static stage with the React app
    document.getElementById('tabs').remove();
    document.querySelector('.stage').remove();
    const root = document.createElement('div');
    document.body.appendChild(root);
    ReactDOM.createRoot(root).render(<App />);
  </script>
</body>
</html>
